<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NoteFlow Pro — Digital Notebook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">✎ <span>NoteFlow</span><small> PRO</small></div>
  <button id="menuBtn">☰</button>
  <input id="noteTitle" value="My JEE Notes" aria-label="Notebook name">
  <span id="saveState">● Saved</span>
  <button id="undo">↶</button><button id="redo">↷</button>
  <button id="importPdf">Import PDF</button><input id="pdfInput" type="file" accept="application/pdf" hidden>
  <button id="exportPdf">Export PDF</button>
  <button id="moreBtn">⋮</button>
</header>

<main>
<aside class="sidebar" id="sidebar">
  <button class="newpage" id="newPage">＋ New Page</button>
  <div class="navrow"><b>NOTEBOOKS</b><button id="newNotebook">＋</button></div>
  <div id="notebooks"></div>
  <div class="navrow"><b>PAGES</b><span id="pageCount">1</span></div>
  <div id="thumbs"></div>
</aside>

<section class="workspace">
  <div class="toolbar">
    <button class="tool active" data-tool="pen">🖊 Pen</button>
    <button class="tool" data-tool="pencil">✎ Pencil</button>
    <button class="tool" data-tool="highlighter">🖍 Marker</button>
    <button class="tool" data-tool="eraser">⌫ Eraser</button>
    <button class="tool" data-tool="line">╱ Line</button>
    <button class="tool" data-tool="arrow">➜ Arrow</button>
    <button class="tool" data-tool="rect">□ Rect</button>
    <button class="tool" data-tool="circle">○ Circle</button>
    <button class="tool" data-tool="text">T Text</button>
    <button class="tool" data-tool="select">⌁ Select</button>
    <label>Color <input id="color" type="color" value="#202020"></label>
    <label>Size <input id="size" type="range" min="1" max="150" value="4"><b id="sizeVal">4 px</b></label>
    <select id="paper"><option value="ruled">Ruled</option><option value="blank">Blank</option><option value="dots">Dots</option><option value="squares">Grid</option><option value="four">Four-line</option></select>
    <button id="zoomOut">−</button><b id="zoomVal">100%</b><button id="zoomIn">＋</button><button id="zoomFit">Fit</button>
  </div>

  <div class="canvas-area" id="canvasArea">
    <canvas id="pageCanvas"></canvas>
    <div id="selectionBox" hidden></div>
  </div>

  <div class="bottomBar">
    <button id="prev">‹</button><span id="pageLabel">1 / 1</span><button id="next">›</button>
    <button id="bookmark">☆ Bookmark</button><button id="duplicate">Duplicate</button>
    <button id="clear">Clear</button>
  </div>
</section>
</main>

<div class="fab" id="fab">＋</div>
<div class="drawer hidden" id="drawer">
  <h2>NoteFlow Pro</h2>
  <div class="cards">
    <button id="searchBtn">🔎 Search notes</button>
    <button id="tagsBtn">🏷 Tags & bookmarks</button>
    <button id="imageBtn">🖼 Insert image</button><input id="imageInput" type="file" accept="image/*" hidden>
    <button id="themeBtn">◐ Theme</button>
    <button id="backupBtn">⬇ Backup notebook</button>
    <button id="restoreBtn">⬆ Restore notebook</button><input id="restoreInput" type="file" accept=".noteflow,.json" hidden>
    <button id="aiBtn">✨ Study assistant</button>
  </div>
  <p class="muted">Autosave • Offline storage • Keyboard shortcuts • PDF/JPG export</p>
</div>

<div class="modal hidden" id="modal"><div class="modalCard"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="app.js"></script>
</body>
</html>
