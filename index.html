<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NoteFlow — Digital Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">✎ <span>NoteFlow</span></div>
  <input id="noteTitle" value="My Notes" aria-label="Note title">
  <div class="actions">
    <button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
    <button id="addPage">＋ Page</button>
    <button id="exportPdf">PDF</button><button id="exportJpg">JPG</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <button class="newpage" id="newPageSide">＋ New Page</button>
    <div class="section-title">PAGES <span id="pageCount">1</span></div>
    <div id="thumbnails"></div>
  </aside>

  <section class="workspace">
    <div class="toolbar">
      <button class="tool active" data-tool="pen">🖊 Pen</button>
      <button class="tool" data-tool="highlighter">🖍 Highlight</button>
      <button class="tool" data-tool="eraser">⌫ Eraser</button>
      <button class="tool" data-tool="text">T Text</button>
      <label>Color <input id="color" type="color" value="#202020"></label>
      <label>Size <input id="size" type="range" min="1" max="30" value="4"><b id="sizeVal">4</b></label>
      <select id="paper">
        <option value="ruled">Ruled</option>
        <option value="blank">Blank</option>
        <option value="dots">Dot Matrix</option>
        <option value="squares">Squares</option>
        <option value="four">Four-line</option>
      </select>
      <button id="clearPage">Clear</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="pageCanvas"></canvas>
      <div id="textLayer"></div>
    </div>
    <div class="pagebar">
      <button id="prev">‹</button><span id="pageLabel">1 / 1</span><button id="next">›</button>
    </div>
  </section>
</main>

<div id="textDialog" class="dialog hidden">
  <div class="dialog-card">
    <h3>Add text</h3>
    <textarea id="textInput" placeholder="Write something..."></textarea>
    <div><button id="cancelText">Cancel</button><button class="primary" id="insertText">Add</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
